name: Weekly Crawl (All Companies)

on:
  schedule:
    # 每周日凌晨 2:00 (UTC+8) = UTC 周六 18:00
    - cron: "0 18 * * 6"
  workflow_dispatch:  # 允许手动触发

jobs:
  batch-crawl:
    name: Trigger Batch Crawl
    runs-on: ubuntu-latest
    steps:
      - name: Trigger batch-crawl endpoint
        run: |
          echo "🚀 触发批量爬取..."

          HTTP_CODE=$(curl -s -o /tmp/crawl_response.json -w "%{http_code}" \
            -X POST "${{ secrets.APP_BASE_URL }}/admin/batch-crawl?secret=${{ secrets.REBUILD_INDEX_SECRET }}")

          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "202" ]; then
            echo "❌ Batch crawl endpoint rejected (HTTP $HTTP_CODE)"
            cat /tmp/crawl_response.json 2>/dev/null || true
            exit 1
          fi

          echo "✅ Batch crawl triggered (HTTP $HTTP_CODE)"
          cat /tmp/crawl_response.json 2>/dev/null || true

      - name: Wait for initial results
        run: |
          echo "⏳ 等待第一批结果（90秒）..."
          sleep 90
          echo "✅ 等待完成，批量爬取在后台继续运行。"
          echo "   完整结果请查看 Azure App Service 日志。"
