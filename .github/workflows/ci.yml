name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 测试 ──────────────────────────────────────────────
  test:
    name: Test (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: pytest tests/ -v

  # ── 部署到 Azure App Service ─────────────────────────
  deploy:
    name: Deploy to Azure
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: "zhice-agent"
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}

  # ── 部署后等待 Bitable RAG 索引就绪 ─────────────────
  # App 启动时会自动检测 chroma_docs==0 并延迟 30s 重建索引。
  # 此 job 只需轮询等待索引构建完成即可，无需手动触发。
  rebuild-index:
    name: Wait for Bitable Index Ready
    needs: deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Validate APP_BASE_URL
        run: |
          BASE_URL="${{ secrets.APP_BASE_URL }}"
          echo "📡 APP_BASE_URL = $BASE_URL"

          if [ -z "$BASE_URL" ]; then
            echo "❌ APP_BASE_URL 未配置！请在 GitHub Secrets 中设置"
            exit 1
          fi

          if [[ "$BASE_URL" != https://* ]] && [[ "$BASE_URL" != http://* ]]; then
            BASE_URL="https://${BASE_URL}"
            echo "⚠️ 自动补充 https:// 前缀 → $BASE_URL"
          fi

          DOMAIN=$(echo "$BASE_URL" | sed 's|https\?://||' | cut -d/ -f1)
          echo "域名: $DOMAIN"

          nslookup "$DOMAIN" || { echo "❌ DNS 解析失败，请检查 URL"; exit 1; }
          echo "✅ DNS 解析成功"

          echo "BASE_URL=$BASE_URL" >> $GITHUB_ENV

      - name: Poll until ChromaDB index ready (max 20 min)
        run: |
          MAX_ATTEMPTS=60
          ATTEMPT=0

          echo "⏳ App 启动后会自动重建 Bitable 索引，等待就绪（最多 20 分钟）..."
          echo ""

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))

            RESPONSE=$(curl -s --connect-timeout 10 --max-time 30 \
              "${{ env.BASE_URL }}/health" 2>/dev/null) || RESPONSE=""

            if [ -z "$RESPONSE" ]; then
              echo "  [${ATTEMPT}/${MAX_ATTEMPTS}] App 尚未就绪，等待启动..."
              sleep 20
              continue
            fi

            CHROMA_DOCS=$(echo "$RESPONSE" | python3 -c \
              "import sys,json; print(json.load(sys.stdin).get('chroma_docs', -1))" \
              2>/dev/null || echo "-1")
            BUILD_STATE=$(echo "$RESPONSE" | python3 -c \
              "import sys,json; print(json.load(sys.stdin).get('bitable_build_state', 'N/A'))" \
              2>/dev/null || echo "N/A")

            echo "  [${ATTEMPT}/${MAX_ATTEMPTS}] chroma_docs=$CHROMA_DOCS, build_state=$BUILD_STATE"

            if [ "$CHROMA_DOCS" -gt 0 ] 2>/dev/null; then
              echo ""
              echo "✅ Bitable RAG 索引就绪！共 $CHROMA_DOCS 条文档"
              exit 0
            fi

            if [ "$BUILD_STATE" = "failed" ]; then
              echo ""
              echo "❌ 索引构建失败，请查看 Azure App Service 日志"
              exit 1
            fi

            sleep 20
          done

          echo ""
          echo "⚠️ 索引构建超时（${MAX_ATTEMPTS} 次轮询），请手动检查 Azure 状态"
