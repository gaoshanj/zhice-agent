name: Daily Reindex (Wiki + Bitable)

on:
  schedule:
    # 每天北京时间凌晨 3:00 (UTC+8) = UTC 19:00
    - cron: "0 19 * * *"
  workflow_dispatch:  # 允许手动触发

jobs:
  reindex-wiki:
    name: Trigger Wiki Reindex
    runs-on: ubuntu-latest
    steps:
      - name: Call rebuild-index endpoint
        run: |
          HTTP_CODE=$(curl -s -o /tmp/reindex_response.json -w "%{http_code}" \
            -X POST "${{ secrets.APP_BASE_URL }}/admin/rebuild-index?secret=${{ secrets.REBUILD_INDEX_SECRET }}")

          echo "HTTP Status: $HTTP_CODE"
          cat /tmp/reindex_response.json

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "202" ]; then
            echo "⚠️ Wiki reindex failed with HTTP $HTTP_CODE (may not be configured)"
          else
            echo "✅ Wiki reindex triggered successfully"
          fi

  reindex-bitable:
    name: Trigger Bitable Reindex
    runs-on: ubuntu-latest
    steps:
      - name: Call build-bitable-index endpoint
        run: |
          HTTP_CODE=$(curl -s -o /tmp/bitable_response.json -w "%{http_code}" \
            -X POST "${{ secrets.APP_BASE_URL }}/admin/build-bitable-index?secret=${{ secrets.REBUILD_INDEX_SECRET }}")

          echo "HTTP Status: $HTTP_CODE"
          cat /tmp/bitable_response.json

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "202" ]; then
            echo "❌ Bitable index build failed with HTTP $HTTP_CODE"
            exit 1
          fi

          echo "✅ Bitable index build triggered successfully"
