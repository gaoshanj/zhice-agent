name: Daily Reindex (Wiki + Bitable)

on:
  schedule:
    # 每天北京时间凌晨 3:00 (UTC+8) = UTC 19:00
    - cron: "0 19 * * *"
  workflow_dispatch:  # 允许手动触发

jobs:
  reindex-wiki:
    name: Trigger Wiki Reindex
    runs-on: ubuntu-latest
    steps:
      - name: Call rebuild-index endpoint
        run: |
          HTTP_CODE=$(curl -s -o /tmp/reindex_response.json -w "%{http_code}" \
            -X POST "${{ secrets.APP_BASE_URL }}/admin/rebuild-index?secret=${{ secrets.REBUILD_INDEX_SECRET }}")

          echo "HTTP Status: $HTTP_CODE"
          cat /tmp/reindex_response.json

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "202" ]; then
            echo "⚠️ Wiki reindex failed with HTTP $HTTP_CODE (may not be configured)"
          else
            echo "✅ Wiki reindex triggered successfully"
          fi

  reindex-bitable:
    name: Trigger Bitable Reindex (with polling)
    runs-on: ubuntu-latest
    steps:
      - name: Call build-bitable-index endpoint
        run: |
          HTTP_CODE=$(curl -s -o /tmp/bitable_response.json -w "%{http_code}" \
            -X POST "${{ secrets.APP_BASE_URL }}/admin/build-bitable-index?secret=${{ secrets.REBUILD_INDEX_SECRET }}")

          echo "HTTP Status: $HTTP_CODE"
          cat /tmp/bitable_response.json

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "202" ]; then
            echo "❌ Bitable endpoint rejected request (HTTP $HTTP_CODE)"
            exit 1
          fi

          echo "✅ Build triggered (202 Accepted)"

      - name: Wait for build
        run: sleep 15

      - name: Verify index built
        run: |
          MAX_WAIT=20
          for i in $(seq 1 $MAX_WAIT); do
            CHROMA_DOCS=$(curl -s "${{ secrets.APP_BASE_URL }}/health" | python3 -c "import sys,json; print(json.load(sys.stdin).get('chroma_docs', -1))" 2>/dev/null || echo "-1")
            echo "[$i/$MAX_WAIT] chroma_docs=$CHROMA_DOCS"
            if [ "$CHROMA_DOCS" -gt 0 ] 2>/dev/null; then
              echo "✅ Daily Bitable reindex complete: $CHROMA_DOCS docs"
              exit 0
            fi
            sleep 15
          done
          echo "❌ Bitable reindex failed: chroma_docs still 0 after $MAX_WAIT attempts"
          exit 1
