[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "zhice-agent"
version = "0.1.0"
description = "培训智策 Agent — 基于飞书机器人 + RAG + LLM 的销售策略报告系统"
requires-python = ">=3.11"
dependencies = [
    # 飞书 SDK
    "lark-oapi>=1.3.0",
    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # LLM & 嵌入
    "openai>=1.51.0",
    # 向量数据库
    "chromadb>=0.5.0",
    # 爬虫
    "playwright>=1.47.0",
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
    # 任务调度
    "apscheduler>=3.10.0",
    # 工具库
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
