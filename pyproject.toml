[project]
name = "zhice-agent"
version = "0.1.1"  # 招聘数据入库（179条智联招聘AI/IT职位）
description = "培训智策 Agent — 基于飞书机器人 + RAG + LLM 的销售策略报告系统"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "lark-oapi>=1.0.0",   # 飞书 SDK（可选，当前用 httpx 直接调用）
    "PyJWT>=2.8.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",   # AsyncClient 用于测试
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

rag = [
    "chromadb>=0.5.0",
    "sentence-transformers>=2.7.0",  # 本地 embedding 备选
    "tiktoken>=0.7.0",
]

crawler = [
    "playwright>=1.45.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "APScheduler>=3.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
